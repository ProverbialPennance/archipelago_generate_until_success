name: Build

on:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - flake.lock
      - .github/workflows/*.yml
  merge_group:
  pull_request:
    branches: ["*"]
    paths:
      - "**.nix"
      - flake.lock
      - .github/workflows/*.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= just-one-more-cache.cachix.org-1:4nShcKEgcUEVlJqKFrgDwoGfqLnw5KPG4UDTV02jnr4=
            substituters = https://cache.nixos.org/ https://just-one-more-cache.cachix.org/
      - uses: cachix/cachix-action@v17
        with:
          name: pp-pet-projects
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - if: env.BRANCH_NAME != 'main'
        run: |
          set -euxo pipefail
          nix build -L --no-link --print-out-paths
      - if: env.BRANCH_NAME == 'main'
        name: build (${{ github.head_ref || github.ref_name }})
        run: |
          set -euxo pipefail
          nix build -L --no-link --print-out-paths | cachix push -l 9 pp-pet-projects
